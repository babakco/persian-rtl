name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax + manifest
        run: npm run check

      - name: Tests
        run: npm test

      - name: manifest.json is in sync with src/sites.js
        run: |
          npm run sync
          git diff --exit-code manifest.json
